
name: larp.os-fedora Validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          test -f README.md
          test -f config/packages/base.txt
          test -f config/packages/desktop.txt
          test -f config/kickstart/larp.ks
          test -f config/kiwi/README.md
          test -f scripts/validate-kiwi.sh
          test -f build/build-iso.sh

      - name: Check shell syntax
        run: |
          find scripts build config/kiwi \
            -type f -name "*.sh" \
            -exec bash -n {} \;

      - name: Check repository structure
        run: |
          test -d branding
          test -d desktop
          test -d installer
          test -d docs
          test -d tests

