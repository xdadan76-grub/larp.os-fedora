
name: larp.os-fedora Validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          test -f README.md
          test -f config/kickstart/larp.ks
          test -f config/packages/base.txt
          test -f config/packages/desktop.txt

      - name: Validate shell scripts
        run: |
          find scripts build -type f -name "*.sh" \
            -exec bash -n {} \;
